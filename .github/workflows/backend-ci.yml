name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements/local.txt
    - name: Run lint (skeleton)
      run: |
        echo "Backend lint skeleton check"
    - name: Run tests (skeleton)
      run: |
        echo "Backend test skeleton check"
